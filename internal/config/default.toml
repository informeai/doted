# doted configuration
#
# Every setting is optional: anything left out keeps the default shown here.
# Changes are applied as soon as the file is saved, except [window] width and
# height, which only apply on startup.

[font]
# Empty uses the system's monospace font: SF Mono on macOS, fontconfig's
# "monospace" on Linux. Otherwise, the name of an installed font
# ("JetBrains Mono", "Menlo"...), "Go Mono" for the built-in font, or a path to
# a .ttf/.otf/.ttc file. With a name, bold and italic variants are picked from
# the same family automatically.
family = ""
size = 15
# Row height as a multiple of the font height.
line_height = 1.3

[window]
width = 960
height = 600
# Space around the content, in points.
padding = 14

[prompt]
symbol = "> "

[cursor]
# "dot" (a ball in the accent color), "block", "bar" or "underline"
style = "dot"
# The dot hops while you type and rests otherwise; the other styles blink
# while you're not typing.
animate = true

[animation]
# Fade-in of new lines and the pulsing dots while a command runs.
enabled = true
fade_in_ms = 180

[scrollback]
lines = 10000

[shell]
# Program used to run commands as `<program> -c "<command>"`. Empty uses $SHELL.
program = ""

# Extra environment variables for commands.
[shell.env]
# EDITOR = "nvim"

# Colors are "#rrggbb" or "#rrggbbaa". The default theme is blue.
[colors]
background = "#0b1220"
foreground = "#d4def0"
muted = "#6b7b99"   # status line, doted's own messages
accent = "#4d9fff"  # prompt, echoed commands, spinner
error = "#ff6b7a"   # errors reported by doted
border = "#1f2d45"  # rules around the input box
cursor = "#4d9fff"

# The 16 ANSI colors programs choose from.
[colors.normal]
black = "#1a2333"
red = "#ff6b7a"
green = "#7fd4a0"
yellow = "#f2cf7a"
blue = "#4d9fff"
magenta = "#b58cff"
cyan = "#4fd1e0"
white = "#d4def0"

[colors.bright]
black = "#4a5a78"
red = "#ff8f9b"
green = "#9ee6b8"
yellow = "#ffe09a"
blue = "#7ab8ff"
magenta = "#caa8ff"
cyan = "#7fe3ef"
white = "#ffffff"
