# doted configuration
#
# Every setting is optional: anything left out keeps the default shown here.
# Changes are applied as soon as the file is saved, except [window] width and
# height, which only apply on startup.

[font]
# Empty uses the system's monospace font: SF Mono on macOS, fontconfig's
# "monospace" on Linux. Otherwise, the name of an installed font
# ("JetBrains Mono", "Menlo"...), "Go Mono" for the built-in font, or a path to
# a .ttf/.otf/.ttc file. With a name, bold and italic variants are picked from
# the same family automatically.
family = ""
size = 15
# Row height as a multiple of the font height.
line_height = 1.3

[window]
# Size of the first window. After that, doted reopens the window the way you
# left it (size, position, maximized), unless remember is false.
width = 1280
height = 800
remember = true
# Space around the content, in points.
padding = 14

[prompt]
# "bar": a vertical bar in the text color that turns to the accent color and
# throws sparks as you type.
# "symbol": the text below.
style = "bar"
symbol = "> "

[cursor]
# "dot" (a ball in the text color that turns to the accent color while you
# type), "block", "bar" or "underline"
style = "dot"
# The dot hops while you type and rests otherwise; the other styles blink
# while you're not typing.
animate = true

[animation]
# Turns off every animation when false: fade-in of new lines, the dots while
# a command runs, the hopping cursor and the typing sparks.
enabled = true
fade_in_ms = 180
# Sparks fired from the prompt bar as you type.
particles = true

[scrollback]
lines = 10000

[history]
# Keep typed commands across sessions, in ~/.local/share/doted/history (or
# $XDG_DATA_HOME/doted/history). A command starting with a space is never
# saved.
save = true
lines = 10000

[clipboard]
# Copy and paste through the system clipboard, to and from other apps. When
# false, they stay inside doted. On Linux this needs wl-clipboard (Wayland)
# or xclip or xsel (X11).
system = true

[links]
# Cmd+click (Ctrl+click on Linux and Windows) opens a URL or a file path
# shown in the output, like main.go:42. Files open with this command line,
# where {file}, {line} and {col} are replaced; empty uses VS Code (code -g)
# when installed, else the system's default app. Examples:
#   editor = "zed {file}:{line}:{col}"
#   editor = "subl {file}:{line}:{col}"
editor = ""

[notify]
# A system notification when a command that ran for at least after_seconds
# finishes while doted is in the background.
enabled = true
after_seconds = 10

[status]
# Show the git branch with what changed (~modified +added -deleted
# ?untracked !conflicts ↑ahead ↓behind) and how long the last command took
# in the status line.
context = true

[shell]
# Program used to run commands as `<program> -c "<command>"`. Empty uses $SHELL.
program = ""

# Extra environment variables for commands.
[shell.env]
# EDITOR = "nvim"

# Colors are "#rrggbb" or "#rrggbbaa". The default theme is blue.
[colors]
background = "#0b1220"
foreground = "#d4def0"
muted = "#6b7b99"   # status line, doted's own messages
accent = "#4d9fff"  # prompt, echoed commands, spinner
error = "#ff6b7a"   # errors reported by doted
border = "#1f2d45"  # rules around the input box
cursor = "#4d9fff"

# The 16 ANSI colors programs choose from.
[colors.normal]
black = "#1a2333"
red = "#ff6b7a"
green = "#7fd4a0"
yellow = "#f2cf7a"
blue = "#4d9fff"
magenta = "#b58cff"
cyan = "#4fd1e0"
white = "#d4def0"

[colors.bright]
black = "#4a5a78"
red = "#ff8f9b"
green = "#9ee6b8"
yellow = "#ffe09a"
blue = "#7ab8ff"
magenta = "#caa8ff"
cyan = "#7fe3ef"
white = "#ffffff"
